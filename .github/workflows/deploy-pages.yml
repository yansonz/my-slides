name: GitHub Pages 배포

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Node.js 설정
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: 의존성 설치
      run: npm install
    
    - name: 슬라이드 빌드
      run: |
        mkdir -p public
        for dir in slides/*/; do
          name=$(basename "$dir")
          npx slidev build "$dir/slides.md" --out "public/$name"
        done
    
    - name: 인덱스 페이지 생성
      run: |
        cat > public/index.html << 'HTML'
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <title>기술 발표 슬라이드</title>
          <style>
            body { font-family: Arial, sans-serif; margin: 40px; }
            h1 { color: #333; }
            ul { list-style-type: none; }
            li { margin: 10px 0; }
            a { color: #0066cc; text-decoration: none; }
            a:hover { text-decoration: underline; }
          </style>
        </head>
        <body>
          <h1>기술 발표 슬라이드</h1>
          <ul>
        HTML
        
        for dir in slides/*/; do
          name=$(basename "$dir")
          echo "    <li><a href=\"$name/\">$name</a></li>" >> public/index.html
        done
        
        cat >> public/index.html << 'HTML'
          </ul>
        </body>
        </html>
        HTML
    
    - name: Pages 설정
      uses: actions/configure-pages@v3
    
    - name: Pages에 업로드
      uses: actions/upload-pages-artifact@v2
      with:
        path: 'public'
    
    - name: Pages 배포
      id: deployment
      uses: actions/deploy-pages@v2
